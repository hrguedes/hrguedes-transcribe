[project]
name = "hrguedes-transcribe"
version = "0.1.0"
description = "Gravador e transcritor de reuniões 100% local"
requires-python = ">=3.11,<3.14"
dependencies = [
    "PySide6>=6.7",
    "faster-whisper>=1.1",
    "sounddevice>=0.5",
    "numpy>=1.26",
]

[project.scripts]
transcribe = "app.main:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
